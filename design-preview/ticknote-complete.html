  function todoView(){return `<div class="tn-toolbar"><div class="tn-tabs" role="tablist" aria-label="待办日期范围">${[['all','全部日期'],['today','今天']].map(([v,l])=>`<button type="button" role="tab" class="tn-tab cursor-interaction" aria-selected="${state.scope===v}" data-scope="${v}">${l}</button>`).join('')}</div><span class="tn-spacer"></span><label class="tn-check"><input type="checkbox" data-show-completed ${state.showCompleted?'checked':''}>显示已完成</label></div><form class="tn-capture" data-form="new-todo"><input class="tn-input" name="new-todo" placeholder="添加一件要做的事…" aria-label="新待办内容" required><select class="tn-input" name="todo-tag" aria-label="新待办标签">${tagOptions('开发')}</select><button class="tn-btn tn-btn-main cursor-interaction" type="submit">添加</button></form><div class="tn-toolbar"><input type="search" class="tn-input tn-search" placeholder="搜索待办内容或标签" aria-label="搜索待办" value="${esc(state.query)}" data-task-search><span class="tn-spacer"></span><label class="tn-check">新建日期 <input type="date" class="tn-input tn-width-small" name="todo-date" value="${TODAY}" aria-label="新建待办所属日期"></label></div><section class="tn-panel" aria-label="待办列表"><div class="tn-panel-heading"><h2>未完成事项<span class="tn-count" data-task-count></span></h2><span>勾选即可完成</span></div><div data-task-list></div><div class="tn-list-bottom"><span data-task-footer></span><span>自动保存</span></div></section>`;}
  function renderTasks(){const filtered=tasks.filter(t=>(state.showCompleted||!t.done)&&(state.scope==='all'||t.date===TODAY)&&(!state.query||(t.text+t.tag).includes(state.query))).sort((a,b)=>b.date.localeCompare(a.date));let last='';$('[data-task-list]').innerHTML=filtered.map(t=>{const d=new Date(t.date+'T12:00:00');const label=`${d.getMonth()+1} 月 ${d.getDate()} 日 · 周${'日一二三四五六'[d.getDay()]}`;const heading=t.date!==last?`<div class="tn-day-heading">${label}${t.date===TODAY?'<span class="tn-tag">今天</span>':''}</div>`:'';last=t.date;return heading+`<div class="tn-task${t.done?' done':''}"><input type="checkbox" aria-label="完成：${esc(t.text)}" data-complete="${t.id}" ${t.done?'checked':''}><div class="tn-task-main"><div class="tn-task-text">${esc(t.text)}</div><div class="tn-task-meta">${t.tag?`<span class="tn-tag">${esc(t.tag)}</span>`:''}<span>${t.done?'已完成':'待完成'}</span></div></div><button type="button" class="tn-row-action cursor-interaction" data-edit-task="${t.id}">编辑</button></div>`;}).join('')||'<div class="tn-empty">没有符合条件的待办。</div>';$('[data-task-count]').textContent=filtered.length+' 项';$('[data-task-footer]').textContent=`全部 ${tasks.length} 项 · 已完成 ${tasks.filter(t=>t.done).length} 项`;}
  function historyView(){return `<div class="tn-toolbar"><label class="tn-check">日期 <input class="tn-input tn-width-small" type="date" name="history-date" value="${TODAY}" data-history-date aria-label="流水日期"></label>${btn('全部日期','all-records')}<input type="search" class="tn-input tn-search" placeholder="搜索工作内容或标签" aria-label="搜索工作流水" data-record-search></div><section class="tn-panel"><div class="tn-panel-heading"><h2>工作记录</h2><span data-record-count></span></div><div data-record-list></div><div class="tn-list-bottom"><span>记录按时间倒序排列</span><button class="tn-btn tn-btn-quiet cursor-interaction" data-action="go-export" type="button">导出流水 →</button></div></section>`;}
  function renderRecords(){const date=$('[data-history-date]').value;const q=$('[data-record-search]').value;const filtered=records.filter(r=>(!date||r.date===date)&&(!q||(r.text+r.tag).includes(q)));$('[data-record-list]').innerHTML=filtered.map(r=>`<div class="tn-record"><div class="tn-record-time">${r.start} — ${r.end}<br>${r.date.slice(5).replace('-',' / ')}</div><div><p>${esc(r.text)}</p><div class="tn-task-meta"><span class="tn-tag">${esc(r.tag)}</span><span>工作记录</span></div></div><button type="button" class="tn-row-action cursor-interaction" data-edit-record="${r.id}">编辑</button></div>`).join('')||'<div class="tn-empty">这一天还没有工作记录。</div>';$('[data-record-count]').textContent=filtered.length+' 条记录';}
  function manualView(){return `<section class="tn-panel"><div class="tn-panel-content"><form class="tn-form" data-form="manual"><div class="tn-form-grid"><label class="tn-field">工作日期<input type="date" name="manual-date" class="tn-input" value="${TODAY}" required></label><label class="tn-field">标签<select name="manual-tag" class="tn-input">${tagOptions('开发')}</select></label><label class="tn-field">开始时间<input type="time" name="manual-start" value="15:00" class="tn-input" required></label><label class="tn-field">结束时间<input type="time" name="manual-end" value="15:45" class="tn-input" required></label></div><label class="tn-field">这段时间做了什么？<textarea name="manual-content" placeholder="写下具体做了什么、完成了什么，之后生成报告会更方便。" required></textarea></label><div class="tn-actions tn-form-foot"><button type="submit" class="tn-btn tn-btn-main cursor-interaction">保存记录</button>${btn('查看历史流水','go-history')}<span class="tn-note">保存后会加入对应日期的工作流水</span></div></form></div></section>`;}
  function reportsView(){let current=reports.find(r=>r.id===state.reportId);if(!current||current.type!==state.reportType){current=reports.find(r=>r.type===state.reportType);state.reportId=current?.id;}return `<section class="tn-panel tn-report-split"><aside class="tn-report-list"><div class="tn-report-tabs">${[['daily','日报'],['weekly','周报']].map(([v,l])=>`<button type="button" class="tn-tab cursor-interaction" data-report-type="${v}" aria-selected="${state.reportType===v}">${l}</button>`).join('')}</div>${reports.filter(r=>r.type===state.reportType).map(r=>`<button type="button" class="tn-report-item cursor-interaction" data-report-id="${r.id}" aria-selected="${r.id===state.reportId}"><span>${esc(r.title)}</span><small>已保存 · ${r.date}</small></button>`).join('')}</aside><div class="tn-editor"><div class="tn-actions"><h2>${current?esc(current.type==='daily'?'工作日报':'工作周报'):'暂无报告'}</h2><span class="tn-spacer"></span><span class="tn-note" data-report-dirty>已保存</span></div><textarea class="tn-report-text" aria-label="报告正文" data-report-body>${esc(current?.body||'')}</textarea><div class="tn-actions">${btn('保存修改','save-report',true)}${btn('复制全文','copy-report')}${btn('删除','delete-report')}</div></div></section>`;}
  function promptText(){const weekly=$('[name=report-kind]:checked')?.value==='weekly',kind=weekly?'周报':'日报';const date=$('[name=generate-date]')?.value||TODAY;const start=new Date(date+'T12:00:00'),end=new Date(date+'T12:00:00');if(weekly){start.setDate(start.getDate()-((start.getDay()+6)%7));end.setTime(start.getTime());end.setDate(end.getDate()+6);}const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,from=iso(start),to=iso(end);return `请根据以下工作记录，整理一份简洁、客观的工作${kind}。\n按“完成事项、进行中的工作、下一步计划”组织内容，不补充未记录的成果。\n\n日期：${weekly?from+' — '+to:date}\n\n工作流水：\n${records.filter(r=>r.date>=from&&r.date<=to).map(r=>`${weekly?r.date+' ':''}${r.start}—${r.end} [${r.tag}] ${r.text}`).join('\n')||'所选日期暂无工作记录。'}`;}
  function generateView(){return `<section class="tn-panel"><div class="tn-panel-content tn-form"><div class="tn-steps"><span class="tn-step-active">1 准备工作记录</span><span>2 复制给 AI</span><span>3 粘贴报告并保存</span></div><div class="tn-form-grid"><div class="tn-field">报告类型<div class="tn-radio-row"><label><input type="radio" name="report-kind" value="daily" checked>日报</label><label><input type="radio" name="report-kind" value="weekly">周报</label></div></div><label class="tn-field">日期<input type="date" class="tn-input" name="generate-date" value="${TODAY}"></label></div><label class="tn-field">提示词与工作记录<textarea readonly class="tn-preview-text" data-prompt>${esc(promptText())}</textarea></label><div class="tn-actions">${btn('复制提示词和数据','copy-prompt',true)}${btn('去导入报告 →','go-import')}</div></div></section>`;}
  function importView(){return `<section class="tn-panel"><form class="tn-panel-content tn-form" data-form="import"><div class="tn-steps"><span>1 准备工作记录</span><span>2 复制给 AI</span><span class="tn-step-active">3 粘贴报告并保存</span></div><div class="tn-form-grid"><label class="tn-field">报告类型<select name="import-type" class="tn-input"><option value="daily">日报</option><option value="weekly">周报</option></select></label><label class="tn-field">报告日期<input name="import-date" type="date" class="tn-input" value="${TODAY}" required></label></div><label class="tn-field">报告正文<textarea name="import-body" class="tn-preview-text" placeholder="将 AI 生成的日报或周报粘贴到这里，也可以直接编辑。" required></textarea></label><div class="tn-actions"><button class="tn-btn tn-btn-main cursor-interaction" type="submit">保存报告</button>${btn('查看我的报告','go-reports')}</div></form></section>`;}
  function exportView(){return `<section class="tn-panel"><div class="tn-panel-content tn-form"><div class="tn-form-grid"><label class="tn-field">开始日期<input type="date" class="tn-input" value="2026-10-26" name="export-start"></label><label class="tn-field">结束日期<input type="date" class="tn-input" value="${TODAY}" name="export-end"></label></div><div class="tn-field">文件格式<div class="tn-radio-row"><label><input type="radio" name="export-format" value="Markdown" checked>Markdown（适合阅读）</label><label><input type="radio" name="export-format" value="CSV">CSV（适合表格处理）</label></div></div><div class="tn-form-foot tn-actions">${btn('导出流水','export-records',true)}<span class="tn-note">导出原始工作记录</span></div></div></section>`;}
  function reminderView(){return `<section class="tn-panel"><div class="tn-reminder-summary"><div style="flex:1;min-width:170px"><div class="tn-reminder-label">${state.paused?'提醒已暂停':'距离下一次起身活动'}</div><div class="tn-countdown">${state.paused?'已暂停':'18:42'}</div><p class="tn-note">每工作 45 分钟，活动 2 分钟</p><div class="tn-progress" role="progressbar" aria-label="本轮工作进度" aria-valuenow="57" aria-valuemin="0" aria-valuemax="100"><div></div></div></div><div class="tn-actions">${btn(state.paused?'恢复提醒':'暂停提醒','toggle-reminder',true)}${btn('现在活动一下','preview-reminder')}</div></div></section><section class="tn-panel" style="margin-top:18px"><div class="tn-panel-heading"><h2>当前规则</h2>${btn('修改设置','go-settings')}</div><div class="tn-panel-content"><div class="tn-settings-row"><div><h3>工作时段</h3><p>仅在设定的工作时间内提醒</p></div><span class="tn-note">09:00 — 18:00</span></div><div class="tn-settings-row"><div><h3>午休暂停</h3><p>午休期间安静待机</p></div><span class="tn-note">12:00 — 13:30</span></div><div class="tn-settings-row"><div><h3>免打扰</h3><p>锁屏、空闲或全屏应用时暂停</p></div><span class="tn-note">已开启</span></div></div></section>`;}
  function settingsView(){return `<form class="tn-form" data-form="settings"><section class="tn-panel"><div class="tn-panel-heading"><h2>提醒与工作时间</h2></div><div class="tn-panel-content"><div class="tn-settings-row"><div><h3>活动提醒间隔</h3><p>连续工作多久后提醒起身</p></div><label class="tn-settings-value"><input type="number" min="1" max="240" class="tn-input tn-width-number" name="interval" value="45" required aria-label="提醒间隔分钟">分钟</label></div><div class="tn-settings-row"><div><h3>活动时长</h3><p>每次起身活动的建议时间</p></div><label class="tn-settings-value"><input type="number" min="1" max="30" class="tn-input tn-width-number" name="duration" value="2" required aria-label="活动时长分钟">分钟</label></div><div class="tn-settings-row"><div><h3>工作时间</h3><p>工作时间之外不提醒</p></div><div class="tn-inline-times"><input type="time" class="tn-input" name="work-start" value="09:00" aria-label="工作开始时间"><span>—</span><input type="time" class="tn-input" name="work-end" value="18:00" aria-label="工作结束时间"></div></div><div class="tn-settings-row"><div><h3>午休时间</h3><p>在午休时段暂停提醒</p></div><div class="tn-inline-times"><input type="time" class="tn-input" name="break-start" value="12:00" aria-label="午休开始时间"><span>—</span><input type="time" class="tn-input" name="break-end" value="13:30" aria-label="午休结束时间"></div></div></div></section><section class="tn-panel"><div class="tn-panel-heading"><h2>使用偏好</h2></div><div class="tn-panel-content"><div class="tn-settings-row"><div><h3>智能免打扰</h3><p>锁屏、长时间空闲或全屏应用时暂停提醒</p></div><input type="checkbox" checked aria-label="开启智能免打扰" name="dnd"></div><div class="tn-settings-row"><div><h3>开机启动</h3><p>登录 Windows 后自动运行</p></div><input type="checkbox" checked aria-label="开启开机启动" name="autostart"></div></div></section><div class="tn-actions"><button type="submit" class="tn-btn tn-btn-main cursor-interaction">保存设置</button><span class="tn-note">还可配置快捷标签、提示词和数据目录</span></div></form>`;}
  function aboutView(){return `<section class="tn-panel tn-about"><span class="tn-mark" aria-hidden="true">✓</span><h2>TickNote <span class="tn-count">v1.0.3</span></h2><p>久坐提醒、工作流水记录与 AI 日报 / 周报助手。</p><p class="tn-note">记录工作，适时休息。工作数据保存在本机，无需账号。</p><div class="tn-form-foot"><p class="tn-note">Windows 10 / 11 · MIT License</p></div></section>`;}
  function modal(title,body,footer){const m=$('[data-modal]');m.innerHTML=`<section class="tn-dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="tn-dialog-top"><h2>${title}</h2><button type="button" class="tn-close cursor-interaction" data-action="close-modal" aria-label="关闭弹窗">×</button></div><div class="tn-dialog-body">${body}</div><div class="tn-dialog-footer">${footer}</div></section>`;m.hidden=false;refreshIcons();const first=m.querySelector('textarea,input,select,button');if(first)first.focus();}
  let previousFocus=null;
  function closeModal(){const m=$('[data-modal]');m.hidden=true;m.innerHTML='';if(previousFocus?.isConnected)previousFocus.focus();}
  function previewReminder(){modal('该起身活动一下了',`<div><p class="tn-dialog-lead">工作告一段落，<br>起来走动 2 分钟吧。</p><p class="tn-note" style="margin-top:10px">伸伸腰、喝口水，让眼睛也休息一下。</p></div><label class="tn-field">这段时间做了什么？<select class="tn-input" data-reminder-todo><option value="">从待办中选择（可选）</option>${tasks.filter(t=>!t.done).map(t=>`<option value="${t.id}">${esc(t.text)}</option>`).join('')}</select><textarea rows="3" name="reminder-note" placeholder="顺手记一句，之后写日报更轻松。"></textarea></label><label class="tn-check"><input type="checkbox" data-reminder-done>同时完成选中的待办</label>`,btn('推迟 5 分钟','snooze-reminder')+btn('跳过本次','skip-reminder')+btn('活动完成','finish-reminder',true));}
  function editTask(id){const t=tasks.find(t=>t.id===id);if(!t)return;modal('编辑待办',`<label class="tn-field">待办内容<textarea rows="3" data-task-edit-text>${esc(t.text)}</textarea></label><div class="tn-form-grid"><label class="tn-field">所属日期<input class="tn-input" type="date" value="${t.date}" data-task-edit-date></label><label class="tn-field">标签<select class="tn-input" data-task-edit-tag>${tagOptions(t.tag)}</select></label></div><p class="tn-error" data-modal-error hidden></p>`,btn('删除','delete-task:'+id)+btn('取消','close-modal')+btn('保存修改','save-task:'+id,true));}
  function reportSave(){const r=reports.find(x=>x.id===state.reportId);if(!r)return;r.body=$('[data-report-body]').value;state.savedReports[r.id]=r.body;delete state.drafts['reports:body:'+r.id];$('[data-report-dirty]').textContent='已保存';notify('示例报告已保存');}
  function showCopy(text,message){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>notify(message)).catch(()=>copyFallback(text));}else copyFallback(text);}
  function copyFallback(text){modal('复制内容',`<p class="tn-note">当前预览环境无法直接访问剪贴板，可选中以下内容复制。</p><textarea rows="10" aria-label="待复制内容">${esc(text)}</textarea>`,btn('关闭','close-modal'));const a=$('[data-modal] textarea');a.select();}
  const actions={
    'focus-new':()=>$('[name=new-todo]').focus(),
    'pause':()=>{state.paused=!state.paused;refreshReminder();if(state.page==='reminder'){captureDraft();render();}notify(state.paused?'提醒已暂停':'提醒已恢复');},

    'delete-report':()=>modal('删除报告','<p>确定删除当前这份示例报告？</p>',btn('取消','close-modal')+btn('确认删除','confirm-delete-report',true)),
    'confirm-delete-report':()=>{const n=reports.findIndex(r=>r.id===state.reportId);if(n>=0)reports.splice(n,1);closeModal();render();notify('已删除示例报告');},
    'copy-prompt':()=>showCopy(promptText(),'提示词和工作记录已复制，可以粘贴给 AI'),
    'export-records':()=>{const start=$('[name=export-start]').value,end=$('[name=export-end]').value;if(start>end){notify('开始日期不能晚于结束日期');return;}const count=records.filter(r=>(!start||r.date>=start)&&(!end||r.date<=end)).length;notify(`导出演示：${count} 条记录 · ${$('[name=export-format]:checked').value} 格式`);},
    'snooze-reminder':()=>{closeModal();notify('已推迟 5 分钟（演示）');},
    'skip-reminder':()=>{closeModal();notify('已跳过本次提醒（演示）');},
    'finish-reminder':()=>{const note=$('[name=reminder-note]').value.trim();if(note)records.unshift({id:Date.now(),date:TODAY,start:'15:00',end:'15:45',text:note,tag:'记录'});const task=tasks.find(t=>String(t.id)===$('[data-reminder-todo]').value);if(task&&$('[data-reminder-done]').checked)task.done=true;closeModal();if(state.page==='todos'||state.page==='history')render();notify(note?'活动已完成，工作记录已保存（演示）':'本次活动已完成（演示）');}
  };
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!root.contains(b))return;
    if(b.dataset.page){navigate(b.dataset.page);return;}
    if(b.dataset.scope){captureDraft();state.scope=b.dataset.scope;render();return;}
    if(b.dataset.editTask){previousFocus=b;editTask(Number(b.dataset.editTask));return;}
    if(b.dataset.editRecord){const r=records.find(r=>r.id===Number(b.dataset.editRecord));previousFocus=b;modal('编辑工作记录',`<label class="tn-field">工作内容<textarea data-record-edit rows="5">${esc(r.text)}</textarea></label><p class="tn-note">${r.date} · ${r.start} — ${r.end}</p><p class="tn-error" data-modal-error hidden></p>`,btn('取消','close-modal')+btn('保存修改','save-record:'+r.id,true));return;}
    if(b.dataset.reportType){captureDraft();const current=reports.find(r=>r.id===state.reportId);if(current)state.drafts['reports:body:'+current.id]=$('[data-report-body]').value;state.reportType=b.dataset.reportType;render();restoreReportDraft();return;}
    if(b.dataset.reportId){const current=reports.find(r=>r.id===state.reportId);if(current)state.drafts['reports:body:'+current.id]=$('[data-report-body]').value;state.reportId=b.dataset.reportId;render();restoreReportDraft();return;}
    const action=b.dataset.action;if(!action)return;
    if(action.startsWith('go-')){navigate(action.slice(3));return;}
    if(action.startsWith('save-task:')){const t=tasks.find(t=>t.id===Number(action.split(':')[1]));const text=$('[data-task-edit-text]').value.trim(),date=$('[data-task-edit-date]').value;if(!text||!date){$('[data-modal-error]').hidden=false;$('[data-modal-error]').textContent='请填写待办内容和日期。';return;}t.text=text;t.date=date;t.tag=$('[data-task-edit-tag]').value;closeModal();renderTasks();notify('示例待办已更新');return;}
    if(action.startsWith('delete-task:')){const id=Number(action.split(':')[1]);tasks=tasks.filter(t=>t.id!==id);closeModal();renderTasks();notify('示例待办已删除');return;}
    if(action.startsWith('save-record:')){const text=$('[data-record-edit]').value.trim();if(!text){$('[data-modal-error]').hidden=false;$('[data-modal-error]').textContent='请填写工作内容。';return;}records.find(r=>r.id===Number(action.split(':')[1])).text=text;closeModal();renderRecords();notify('示例记录已更新');return;}
    if(action==='preview-reminder')previousFocus=b;

    'clear-draft':()=>showFull('confirm-clear'),
    'main-calendar':()=>showFull('calendar'),
    'pick-todo':()=>openPicker(true),
    'pick-history':()=>openPicker(false),
    'picker-calendar':()=>showFull('calendar'),
    'picker-all':()=>{const search=root.querySelector('[data-f-pick-search]');if(search)search.value='';root.querySelectorAll('[data-f-pick-row]').forEach(r=>r.hidden=false);const count=root.querySelector('[data-f-pick-count]');if(count)count.textContent=records.length+' 项';},
    'accept-pick':()=>{if(full.selected===null)return;const todo=full.screen==='picker-todo';const item=(todo?tasks:records).find(x=>String(x.id)===String(full.selected));if(!item)return;full.note=item.text;full.tag=item.tag;full.saved=false;const target=full.stack.pop()||'reminder-default';if(target==='main-manual'){state.drafts['manual:manual-content']=item.text;state.drafts['manual:manual-tag']=item.tag;showFull(target,false);}else showFull(todo?'reminder-todo':target,false);notify(todo?'内容和标签已填入草稿，待办状态未改变':'已带入历史记录，可继续填写');},
    'copy-picked':()=>{const item=records.find(x=>String(x.id)===String(full.selected));if(item)fCopy(item.text);else notify('请先选择一条记录');},
    'calendar-day':arg=>{const target=full.stack.pop()||'main-history';showFull(target,false);if(target==='main-history'){root.querySelector('[data-history-date]').value=arg;renderRecords();}else if(target==='picker-history'){root.querySelectorAll('[data-f-pick-row]').forEach(row=>row.hidden=row.dataset.date!==arg);const count=root.querySelector('[data-f-pick-count]');if(count)count.textContent=records.filter(r=>r.date===arg).length+' 项';}notify('已选择 '+arg);},
    'calendar-prev':()=>{full.calendarMonth='2026-09';render();},
    'calendar-next':()=>{full.calendarMonth='2026-10';render();},
    'toggle-tag':arg=>{captureFull();full.tag=full.tag===arg?'':arg;render();},
    'toggle-logs':()=>{captureFull();full.logsVisible=!full.logsVisible;if(full.screen==='reminder-logs'&&!full.logsVisible)full.screen='reminder-default';render();},
    'save-reminder':()=>{captureFull();if(!full.note.trim()){showFull('reminder-empty',false);notify('先写一点工作内容，再保存记录');return;}records.unshift({id:Date.now(),date:TODAY,start:'15:00',end:'15:45',text:full.note.trim(),tag:full.tag||'记录'});full.note='';full.saved=true;full.screen='reminder-saved';render();notify('示例工作记录已保存');},
    'continue-record':arg=>{const item=records.find(r=>String(r.id)===arg);if(item){full.note=item.text;full.tag=item.tag;full.saved=false;render();notify('已带入这项工作，可以继续填写');}},
    'edit-record':arg=>{full.selectedLog=Number(arg);showFull('edit-related');},
    'copy-record':arg=>{const item=records.find(r=>String(r.id)===arg);if(item)fCopy(item.text);},
    'delete-record':arg=>{full.selectedLog=Number(arg);showFull('confirm-delete-log');},
    'release-reminder':()=>showFull('access'),
    'copy-draft':()=>fCopy(full.note||'确认新版本的界面布局与交互流程，补充缩放与对齐检查项。'),
    'restore-reminder':()=>{full.stack=[];showFull('reminder-default',false);},
    'finish-break':()=>{full.stack=[];full.saved=false;showFull('main-reminder',false);notify('活动已完成（演示）');},
    'skip-break':()=>{full.stack=[];showFull('main-reminder',false);notify('已跳过本次提醒（演示）');},
    'postpone-break':()=>{full.stack=[];showFull('main-reminder',false);notify('已推迟 5 分钟（演示）');},
    'save-edited':arg=>{const text=root.querySelector('[data-f-edit-content]').value.trim();const error=root.querySelector('[data-f-edit-error]');if(!text){error.hidden=false;error.textContent=arg==='todo'?'待办内容不能为空。':'工作内容不能为空。';return;}const item=arg==='todo'?tasks.find(t=>t.id===full.selectedTask):records.find(r=>r.id===full.selectedLog);if(arg==='log'){const start=root.querySelector('[data-f-edit-start]').value,end=root.querySelector('[data-f-edit-end]').value;if(start>=end){error.hidden=false;error.textContent='结束时间需要晚于开始时间。';return;}if(item){item.date=root.querySelector('[data-f-edit-date]').value;item.start=start;item.end=end;}}if(item){item.text=text;item.tag=root.querySelector('[list=tn-all-tags]').value;}backFull();notify('示例内容已保存');},
    'wizard-folder':()=>showFull('native-folder'),
    'wizard-start':()=>{const custom=root.querySelector('[name=full-storage]:checked')?.value==='custom';const path=root.querySelector('[name=wizard-path]').value.trim();if(custom&&!path){notify('请选择或填写数据目录');return;}full.stack=[];showFull('main-todos',false);notify('开始使用（演示，不创建文件或目录）');},
    'native-select':()=>{},
    'native-accept':arg=>{const previous=full.stack.pop()||'main-export';showFull(previous,false);if(arg==='folder'){if(previous.startsWith('wizard'))showFull('wizard-custom',false);else showFull('confirm-migrate');}else{messages.success.title='导出成功';messages.success.text='示例工作流水已准备导出。';messages.success.detail='D:\\文档\\工作流水_2026-10-26_2026-10-30.md';showFull('success');}},
    'tray-page':arg=>{full.stack=[];showFull('main-'+arg,false);},
    'tray-copy':arg=>{full.stack=[];showFull('balloon',false);notify(arg==='weekly'?'周报提示词已复制（演示）':'日报提示词已复制（演示）');},
    'tray-pause':()=>showFull('tray-pause',false),
    'tray-resume':()=>{state.paused=false;showFull('tray-counting',false);notify('提醒已恢复（演示）');},
    'tray-exit':()=>showFull('confirm-unsaved'),
    'pause-time':arg=>{state.paused=true;showFull('main-reminder');notify(arg==='today'?'已暂停到今天下班（演示）':`已暂停 ${arg} 分钟（演示）`);},
    'confirm-clear':()=>{const field=root.querySelector('[name=manual-content]');if(field)field.value='';delete state.drafts['manual:manual-content'];backFull();notify('草稿已清空（演示）');},
    'confirm-delete':arg=>{if(arg==='todo')tasks=tasks.filter(t=>t.id!==full.selectedTask);if(arg==='log')records=records.filter(r=>r.id!==full.selectedLog);if(arg==='report'){const index=reports.findIndex(r=>r.id===state.reportId);if(index>=0)reports.splice(index,1);}backFull();notify('示例内容已删除');},
    'import-new':()=>completeImport(false),
    'import-overwrite':()=>completeImport(true),
    'simulate-migrate':()=>{full.stack=[];showFull('settings-data',false);messages.success.title='数据位置已更换';messages.success.text='迁移完成后，软件会自动重新启动。';messages.success.detail='当前是界面预览，不移动文件或重新启动程序。';showFull('success');},
    discard:()=>{backFull();notify('已放弃修改并继续（演示）');},
    ack:()=>{backFull();notify('已保存并继续（演示）');},
    'copy-long':()=>fCopy(root.querySelector('.tn-window-body textarea').value)
  };
  root.addEventListener('click',event=>{const button=event.target.closest('button[data-f-action]');if(!button)return;if(button.dataset.fAction==='native-select'){root.querySelectorAll('.tn-native-file').forEach(el=>el.setAttribute('aria-selected',String(el===button)));return;}faction[button.dataset.fAction]?.(button.dataset.fArg||'');});
  root.addEventListener('input',event=>{if(event.target.matches('[data-f-note]')){full.note=event.target.value;root.querySelectorAll('[data-f-note]').forEach(el=>{if(el!==event.target)el.value=full.note;});}if(event.target.matches('[data-f-pick-search]'))filterPicker();});
  root.addEventListener('change',event=>{
    if(event.target.name==='full-pick'){full.selected=event.target.value;const button=root.querySelector('[data-f-action=accept-pick]');if(button)button.disabled=false;const item=records.find(r=>String(r.id)===String(full.selected)),preview=root.querySelector('[data-f-pick-preview]');if(preview)preview.value=item?.text||'';}
    if(event.target.matches('[data-f-pick-date]'))filterPicker();
    if(event.target.matches('[data-f-month]')){full.calendarMonth=event.target.value;render();}
    if(event.target.name==='full-storage')showFull(event.target.value==='custom'?'wizard-custom':'wizard',false);
  });
  root.addEventListener('submit',event=>{if(event.target.dataset.form==='import'){const data=new FormData(event.target),type=data.get('import-type'),date=data.get('import-date'),body=data.get('import-body').trim();if(body&&reports.some(r=>r.type===type&&r.date===date)){event.preventDefault();event.stopImmediatePropagation();full.pendingImport={type,date,body};showFull('confirm-overwrite');}}},true);
  root.addEventListener('submit',event=>{if(event.target.dataset.form==='settings'){captureDraft();full.savedSettings=Object.fromEntries(Object.entries(state.drafts).filter(([key])=>key.startsWith('settings:')));full.savedTags=[...full.tags];}});
  root.addEventListener('keydown',event=>{if(event.key==='Escape'&&root.dataset.fullMode==='extra'){event.preventDefault();if(full.screen.startsWith('reminder-'))faction['postpone-break']();else backFull();}});

  restoreHost(window.openai?.widgetState);applyDesign();render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restoreHost(event.detail.globals.widgetState);applyDesign();render();}});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{applyDesign();saveState();}});tweak.addColorPicker(design,'accent',{label:'强调色',reference:'--tn-accent'});tweak.addToggle(design,'compact',{label:'紧凑间距'});}
})();
</script>

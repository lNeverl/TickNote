  function todoView(){return `<div class="tn-toolbar"><div class="tn-tabs" role="tablist" aria-label="待办日期范围">${[['all','全部日期'],['today','今天']].map(([v,l])=>`<button type="button" role="tab" class="tn-tab cursor-interaction" aria-selected="${state.scope===v}" data-scope="${v}">${l}</button>`).join('')}</div><span class="tn-spacer"></span><label class="tn-check"><input type="checkbox" data-show-completed ${state.showCompleted?'checked':''}>显示已完成</label></div><form class="tn-capture" data-form="new-todo"><input class="tn-input" name="new-todo" placeholder="添加一件要做的事…" aria-label="新待办内容" required><select class="tn-input" name="todo-tag" aria-label="新待办标签">${tagOptions('开发')}</select><button class="tn-btn tn-btn-main cursor-interaction" type="submit">添加</button></form><div class="tn-toolbar"><input type="search" class="tn-input tn-search" placeholder="搜索待办内容或标签" aria-label="搜索待办" value="${esc(state.query)}" data-task-search><span class="tn-spacer"></span><label class="tn-check">新建日期 <input type="date" class="tn-input tn-width-small" name="todo-date" value="${TODAY}" aria-label="新建待办所属日期"></label></div><section class="tn-panel" aria-label="待办列表"><div class="tn-panel-heading"><h2>未完成事项<span class="tn-count" data-task-count></span></h2><span>勾选即可完成</span></div><div data-task-list></div><div class="tn-list-bottom"><span data-task-footer></span><span>自动保存</span></div></section>`;}
  function renderTasks(){const filtered=tasks.filter(t=>(state.showCompleted||!t.done)&&(state.scope==='all'||t.date===TODAY)&&(!state.query||(t.text+t.tag).includes(state.query))).sort((a,b)=>b.date.localeCompare(a.date));let last='';$('[data-task-list]').innerHTML=filtered.map(t=>{const d=new Date(t.date+'T12:00:00');const label=`${d.getMonth()+1} 月 ${d.getDate()} 日 · 周${'日一二三四五六'[d.getDay()]}`;const heading=t.date!==last?`<div class="tn-day-heading">${label}${t.date===TODAY?'<span class="tn-tag">今天</span>':''}</div>`:'';last=t.date;return heading+`<div class="tn-task${t.done?' done':''}"><input type="checkbox" aria-label="完成：${esc(t.text)}" data-complete="${t.id}" ${t.done?'checked':''}><div class="tn-task-main"><div class="tn-task-text">${esc(t.text)}</div><div class="tn-task-meta">${t.tag?`<span class="tn-tag">${esc(t.tag)}</span>`:''}<span>${t.done?'已完成':'待完成'}</span></div></div><button type="button" class="tn-row-action cursor-interaction" data-edit-task="${t.id}">编辑</button></div>`;}).join('')||'<div class="tn-empty">没有符合条件的待办。</div>';$('[data-task-count]').textContent=filtered.length+' 项';$('[data-task-footer]').textContent=`全部 ${tasks.length} 项 · 已完成 ${tasks.filter(t=>t.done).length} 项`;}
  function historyView(){return `<div class="tn-toolbar"><label class="tn-check">日期 <input class="tn-input tn-width-small" type="date" name="history-date" value="${TODAY}" data-history-date aria-label="流水日期"></label>${btn('全部日期','all-records')}<input type="search" class="tn-input tn-search" placeholder="搜索工作内容或标签" aria-label="搜索工作流水" data-record-search></div><section class="tn-panel"><div class="tn-panel-heading"><h2>工作记录</h2><span data-record-count></span></div><div data-record-list></div><div class="tn-list-bottom"><span>记录按时间倒序排列</span><button class="tn-btn tn-btn-quiet cursor-interaction" data-action="go-export" type="button">导出流水 →</button></div></section>`;}

  function manualView(){return `<section class="tn-panel"><div class="tn-panel-content"><form class="tn-form" data-form="manual"><div class="tn-form-grid"><label class="tn-field">工作日期<input type="date" name="manual-date" class="tn-input" value="${TODAY}" required></label><label class="tn-field">标签<select name="manual-tag" class="tn-input">${tagOptions('开发')}</select></label><label class="tn-field">开始时间<input type="time" name="manual-start" value="15:00" class="tn-input" required></label><label class="tn-field">结束时间<input type="time" name="manual-end" value="15:45" class="tn-input" required></label></div><label class="tn-field">这段时间做了什么？<textarea name="manual-content" placeholder="写下具体做了什么、完成了什么，之后生成报告会更方便。" required></textarea></label><div class="tn-actions tn-form-foot"><button type="submit" class="tn-btn tn-btn-main cursor-interaction">保存记录</button>${btn('查看历史流水','go-history')}<span class="tn-note">保存后会加入对应日期的工作流水</span></div></form></div></section>`;}
  function reportsView(){let current=reports.find(r=>r.id===state.reportId);if(!current||current.type!==state.reportType){current=reports.find(r=>r.type===state.reportType);state.reportId=current?.id;}return `<section class="tn-panel tn-report-split"><aside class="tn-report-list"><div class="tn-report-tabs">${[['daily','日报'],['weekly','周报']].map(([v,l])=>`<button type="button" class="tn-tab cursor-interaction" data-report-type="${v}" aria-selected="${state.reportType===v}">${l}</button>`).join('')}</div>${reports.filter(r=>r.type===state.reportType).map(r=>`<button type="button" class="tn-report-item cursor-interaction" data-report-id="${r.id}" aria-selected="${r.id===state.reportId}"><span>${esc(r.title)}</span><small>已保存 · ${r.date}</small></button>`).join('')}</aside><div class="tn-editor"><div class="tn-actions"><h2>${current?esc(current.type==='daily'?'工作日报':'工作周报'):'暂无报告'}</h2><span class="tn-spacer"></span><span class="tn-note" data-report-dirty>已保存</span></div><textarea class="tn-report-text" aria-label="报告正文" data-report-body>${esc(current?.body||'')}</textarea><div class="tn-actions">${btn('保存修改','save-report',true)}${btn('复制全文','copy-report')}${btn('删除','delete-report')}</div></div></section>`;}

  function previewReminder(){modal('该起身活动一下了',`<div><p class="tn-dialog-lead">工作告一段落，<br>起来走动 2 分钟吧。</p><p class="tn-note" style="margin-top:10px">伸伸腰、喝口水，让眼睛也休息一下。</p></div><label class="tn-field">这段时间做了什么？<select class="tn-input" data-reminder-todo><option value="">从待办中选择（可选）</option>${tasks.filter(t=>!t.done).map(t=>`<option value="${t.id}">${esc(t.text)}</option>`).join('')}</select><textarea rows="3" name="reminder-note" placeholder="顺手记一句，之后写日报更轻松。"></textarea></label><label class="tn-check"><input type="checkbox" data-reminder-done>同时完成选中的待办</label>`,btn('推迟 5 分钟','snooze-reminder')+btn('跳过本次','skip-reminder')+btn('活动完成','finish-reminder',true));}
  function editTask(id){const t=tasks.find(t=>t.id===id);if(!t)return;modal('编辑待办',`<label class="tn-field">待办内容<textarea rows="3" data-task-edit-text>${esc(t.text)}</textarea></label><div class="tn-form-grid"><label class="tn-field">所属日期<input class="tn-input" type="date" value="${t.date}" data-task-edit-date></label><label class="tn-field">标签<select class="tn-input" data-task-edit-tag>${tagOptions(t.tag)}</select></label></div><p class="tn-error" data-modal-error hidden></p>`,btn('删除','delete-task:'+id)+btn('取消','close-modal')+btn('保存修改','save-task:'+id,true));}
  function reportSave(){const r=reports.find(x=>x.id===state.reportId);if(!r)return;r.body=$('[data-report-body]').value;state.savedReports[r.id]=r.body;delete state.drafts['reports:body:'+r.id];$('[data-report-dirty]').textContent='已保存';notify('示例报告已保存');}
  function showCopy(text,message){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>notify(message)).catch(()=>copyFallback(text));}else copyFallback(text);}
  function copyFallback(text){modal('复制内容',`<p class="tn-note">当前预览环境无法直接访问剪贴板，可选中以下内容复制。</p><textarea rows="10" aria-label="待复制内容">${esc(text)}</textarea>`,btn('关闭','close-modal'));const a=$('[data-modal] textarea');a.select();}
  const actions={
    'focus-new':()=>$('[name=new-todo]').focus(),
    'pause':()=>{state.paused=!state.paused;refreshReminder();if(state.page==='reminder'){captureDraft();render();}notify(state.paused?'提醒已暂停':'提醒已恢复');},
    'toggle-reminder':()=>actions.pause(),
    'preview-reminder':previewReminder,
    'close-modal':closeModal,
    'all-records':()=>{$('[data-history-date]').value='';renderRecords();},
    'save-report':reportSave,
    'copy-report':()=>showCopy($('[data-report-body]').value,'报告全文已复制'),
    'delete-report':()=>modal('删除报告','<p>确定删除当前这份示例报告？</p>',btn('取消','close-modal')+btn('确认删除','confirm-delete-report',true)),
    'confirm-delete-report':()=>{const n=reports.findIndex(r=>r.id===state.reportId);if(n>=0)reports.splice(n,1);closeModal();render();notify('已删除示例报告');},
    'copy-prompt':()=>showCopy(promptText(),'提示词和工作记录已复制，可以粘贴给 AI'),
    'export-records':()=>{const start=$('[name=export-start]').value,end=$('[name=export-end]').value;if(start>end){notify('开始日期不能晚于结束日期');return;}const count=records.filter(r=>(!start||r.date>=start)&&(!end||r.date<=end)).length;notify(`导出演示：${count} 条记录 · ${$('[name=export-format]:checked').value} 格式`);},
    'snooze-reminder':()=>{closeModal();notify('已推迟 5 分钟（演示）');},
    'skip-reminder':()=>{closeModal();notify('已跳过本次提醒（演示）');},
    'finish-reminder':()=>{const note=$('[name=reminder-note]').value.trim();if(note)records.unshift({id:Date.now(),date:TODAY,start:'15:00',end:'15:45',text:note,tag:'记录'});const task=tasks.find(t=>String(t.id)===$('[data-reminder-todo]').value);if(task&&$('[data-reminder-done]').checked)task.done=true;closeModal();if(state.page==='todos'||state.page==='history')render();notify(note?'活动已完成，工作记录已保存（演示）':'本次活动已完成（演示）');}
  };
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!root.contains(b))return;
    if(b.dataset.page){navigate(b.dataset.page);return;}
    if(b.dataset.scope){captureDraft();state.scope=b.dataset.scope;render();return;}
    if(b.dataset.editTask){previousFocus=b;editTask(Number(b.dataset.editTask));return;}
    if(b.dataset.editRecord){const r=records.find(r=>r.id===Number(b.dataset.editRecord));previousFocus=b;modal('编辑工作记录',`<label class="tn-field">工作内容<textarea data-record-edit rows="5">${esc(r.text)}</textarea></label><p class="tn-note">${r.date} · ${r.start} — ${r.end}</p><p class="tn-error" data-modal-error hidden></p>`,btn('取消','close-modal')+btn('保存修改','save-record:'+r.id,true));return;}
    if(b.dataset.reportType){captureDraft();const current=reports.find(r=>r.id===state.reportId);if(current)state.drafts['reports:body:'+current.id]=$('[data-report-body]').value;state.reportType=b.dataset.reportType;render();restoreReportDraft();return;}
    if(b.dataset.reportId){const current=reports.find(r=>r.id===state.reportId);if(current)state.drafts['reports:body:'+current.id]=$('[data-report-body]').value;state.reportId=b.dataset.reportId;render();restoreReportDraft();return;}
    const action=b.dataset.action;if(!action)return;
    if(action.startsWith('go-')){navigate(action.slice(3));return;}
    if(action.startsWith('save-task:')){const t=tasks.find(t=>t.id===Number(action.split(':')[1]));const text=$('[data-task-edit-text]').value.trim(),date=$('[data-task-edit-date]').value;if(!text||!date){$('[data-modal-error]').hidden=false;$('[data-modal-error]').textContent='请填写待办内容和日期。';return;}t.text=text;t.date=date;t.tag=$('[data-task-edit-tag]').value;closeModal();renderTasks();notify('示例待办已更新');return;}
    if(action.startsWith('delete-task:')){const id=Number(action.split(':')[1]);tasks=tasks.filter(t=>t.id!==id);closeModal();renderTasks();notify('示例待办已删除');return;}
    if(action.startsWith('save-record:')){const text=$('[data-record-edit]').value.trim();if(!text){$('[data-modal-error]').hidden=false;$('[data-modal-error]').textContent='请填写工作内容。';return;}records.find(r=>r.id===Number(action.split(':')[1])).text=text;closeModal();renderRecords();notify('示例记录已更新');return;}
    if(action==='preview-reminder')previousFocus=b;
    actions[action]?.();
  });
  function restoreReportDraft(){const key='reports:body:'+state.reportId;if(state.drafts[key]!==undefined){$('[data-report-body]').value=state.drafts[key];const r=reports.find(r=>r.id===state.reportId);$('[data-report-dirty]').textContent=state.drafts[key]===r?.body?'已保存':'有未保存的修改';}}
  root.addEventListener('input',e=>{if(e.target.matches('[data-task-search]')){state.query=e.target.value;renderTasks();}if(e.target.matches('[data-record-search]'))renderRecords();if(e.target.matches('[data-report-body]')){const r=reports.find(r=>r.id===state.reportId);state.drafts['reports:body:'+state.reportId]=e.target.value;$('[data-report-dirty]').textContent=e.target.value===r?.body?'已保存':'有未保存的修改';}if(e.target.matches('[name=generate-date]'))$('[data-prompt]').value=promptText();});
  root.addEventListener('change',e=>{if(e.target.matches('[data-show-completed]')){state.showCompleted=e.target.checked;renderTasks();}if(e.target.dataset.complete){tasks.find(t=>t.id===Number(e.target.dataset.complete)).done=e.target.checked;renderTasks();notify('示例待办状态已保存');}if(e.target.matches('[data-history-date]'))renderRecords();if(e.target.matches('[name=report-kind]'))$('[data-prompt]').value=promptText();if(e.target.matches('[data-reminder-todo]')){const task=tasks.find(t=>String(t.id)===e.target.value);$('[name=reminder-note]').value=task?.text||'';}});
  root.addEventListener('submit',e=>{e.preventDefault();const kind=e.target.dataset.form;const data=new FormData(e.target);if(kind==='new-todo'){const text=data.get('new-todo').trim();if(!text)return;const date=$('[name=todo-date]').value||TODAY;tasks.unshift({id:Date.now(),text,tag:data.get('todo-tag'),date,done:false});e.target.elements['new-todo'].value='';delete state.drafts['todos:new-todo'];renderTasks();notify('示例待办已添加');}if(kind==='manual'){const text=data.get('manual-content').trim();if(!text){notify('请填写工作内容');return;}if(data.get('manual-start')>=data.get('manual-end')){notify('结束时间需要晚于开始时间');return;}records.unshift({id:Date.now(),date:data.get('manual-date'),start:data.get('manual-start'),end:data.get('manual-end'),text,tag:data.get('manual-tag')||'记录'});e.target.elements['manual-content'].value='';notify('示例工作记录已保存');}if(kind==='import'){const text=data.get('import-body').trim();if(!text)return;const id='import-'+Date.now();reports.unshift({id,type:data.get('import-type'),date:data.get('import-date'),title:data.get('import-date'),body:text});state.reportId=id;state.reportType=data.get('import-type');e.target.elements['import-body'].value='';navigate('reports');notify('示例报告已保存');}if(kind==='settings'){captureDraft();notify('设置已保存（演示）');}});
  root.addEventListener('keydown',e=>{const modal=$('[data-modal]');if(modal.hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const controls=[...modal.querySelectorAll('button,input,select,textarea')].filter(el=>!el.disabled&&el.getClientRects().length),first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
  function restoreHost(saved){const p=saved?.privateContent;if(p?.page&&info[p.page])state.page=p.page;if(p?.design){if(/^#[0-9a-f]{6}$/i.test(p.design.accent))design.accent=p.design.accent;design.compact=!!p.design.compact;}}
  restoreHost(window.openai?.widgetState);applyDesign();render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restoreHost(event.detail.globals.widgetState);applyDesign();render();}});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{applyDesign();saveState();}});tweak.addColorPicker(design,'accent',{label:'强调色',reference:'--tn-accent'});tweak.addToggle(design,'compact',{label:'紧凑间距'});}
})();
</script>

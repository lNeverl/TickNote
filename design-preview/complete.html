  function renderTasks(){const filtered=tasks.filter(t=&gt;(state.showCompleted||!t.done)&amp;&amp;(state.scope===&#x27;all&#x27;||t.date===TODAY)&amp;&amp;(!state.query||(t.text+t.tag).includes(state.query))).sort((a,b)=&gt;b.date.localeCompare(a.date));let last=&#x27;&#x27;;$(&#x27;[data-task-list]&#x27;).innerHTML=filtered.map(t=&gt;{const d=new Date(t.date+&#x27;T12:00:00&#x27;);const label=`${d.getMonth()+1} 月 ${d.getDate()} 日 · 周${&#x27;日一二三四五六&#x27;[d.getDay()]}`;const heading=t.date!==last?`&lt;div class=&quot;tn-day-heading&quot;&gt;${label}${t.date===TODAY?&#x27;&lt;span class=&quot;tn-tag&quot;&gt;今天&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;`:&#x27;&#x27;;last=t.date;return heading+`&lt;div class=&quot;tn-task${t.done?&#x27; done&#x27;:&#x27;&#x27;}&quot;&gt;&lt;input type=&quot;checkbox&quot; aria-label=&quot;完成：${esc(t.text)}&quot; data-complete=&quot;${t.id}&quot; ${t.done?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;div class=&quot;tn-task-main&quot;&gt;&lt;div class=&quot;tn-task-text&quot;&gt;${esc(t.text)}&lt;/div&gt;&lt;div class=&quot;tn-task-meta&quot;&gt;${t.tag?`&lt;span class=&quot;tn-tag&quot;&gt;${esc(t.tag)}&lt;/span&gt;`:&#x27;&#x27;}&lt;span&gt;${t.done?&#x27;已完成&#x27;:&#x27;待完成&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;tn-row-action cursor-interaction&quot; data-edit-task=&quot;${t.id}&quot;&gt;编辑&lt;/button&gt;&lt;/div&gt;`;}).join(&#x27;&#x27;)||&#x27;&lt;div class=&quot;tn-empty&quot;&gt;没有符合条件的待办。&lt;/div&gt;&#x27;;$(&#x27;[data-task-count]&#x27;).textContent=filtered.length+&#x27; 项&#x27;;$(&#x27;[data-task-footer]&#x27;).textContent=`全部 ${tasks.length} 项 · 已完成 ${tasks.filter(t=&gt;t.done).length} 项`;}

  function promptText(){const weekly=$(&#x27;[name=report-kind]:checked&#x27;)?.value===&#x27;weekly&#x27;,kind=weekly?&#x27;周报&#x27;:&#x27;日报&#x27;;const date=$(&#x27;[name=generate-date]&#x27;)?.value||TODAY;const start=new Date(date+&#x27;T12:00:00&#x27;),end=new Date(date+&#x27;T12:00:00&#x27;);if(weekly){start.setDate(start.getDate()-((start.getDay()+6)%7));end.setTime(start.getTime());end.setDate(end.getDate()+6);}const iso=d=&gt;`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,&#x27;0&#x27;)}-${String(d.getDate()).padStart(2,&#x27;0&#x27;)}`,from=iso(start),to=iso(end);return `请根据以下工作记录，整理一份简洁、客观的工作${kind}。\n按“完成事项、进行中的工作、下一步计划”组织内容，不补充未记录的成果。\n\n日期：${weekly?from+&#x27; — &#x27;+to:date}\n\n工作流水：\n${records.filter(r=&gt;r.date&gt;=from&amp;&amp;r.date&lt;=to).map(r=&gt;`${weekly?r.date+&#x27; &#x27;:&#x27;&#x27;}${r.start}—${r.end} [${r.tag}] ${r.text}`).join(&#x27;\n&#x27;)||&#x27;所选日期暂无工作记录。&#x27;}`;}
  function generateView(){return `&lt;section class=&quot;tn-panel&quot;&gt;&lt;div class=&quot;tn-panel-content tn-form&quot;&gt;&lt;div class=&quot;tn-steps&quot;&gt;&lt;span class=&quot;tn-step-active&quot;&gt;1 准备工作记录&lt;/span&gt;&lt;span&gt;2 复制给 AI&lt;/span&gt;&lt;span&gt;3 粘贴报告并保存&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;tn-form-grid&quot;&gt;&lt;div class=&quot;tn-field&quot;&gt;报告类型&lt;div class=&quot;tn-radio-row&quot;&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;report-kind&quot; value=&quot;daily&quot; checked&gt;日报&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;report-kind&quot; value=&quot;weekly&quot;&gt;周报&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;&lt;label class=&quot;tn-field&quot;&gt;日期&lt;input type=&quot;date&quot; class=&quot;tn-input&quot; name=&quot;generate-date&quot; value=&quot;${TODAY}&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;label class=&quot;tn-field&quot;&gt;提示词与工作记录&lt;textarea readonly class=&quot;tn-preview-text&quot; data-prompt&gt;${esc(promptText())}&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;tn-actions&quot;&gt;${btn(&#x27;复制提示词和数据&#x27;,&#x27;copy-prompt&#x27;,true)}${btn(&#x27;去导入报告 →&#x27;,&#x27;go-import&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;`;}

  function modal(title,body,footer){const m=$(&#x27;[data-modal]&#x27;);m.innerHTML=`&lt;section class=&quot;tn-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;${esc(title)}&quot;&gt;&lt;div class=&quot;tn-dialog-top&quot;&gt;&lt;h2&gt;${title}&lt;/h2&gt;&lt;button type=&quot;button&quot; class=&quot;tn-close cursor-interaction&quot; data-action=&quot;close-modal&quot; aria-label=&quot;关闭弹窗&quot;&gt;×&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;tn-dialog-body&quot;&gt;${body}&lt;/div&gt;&lt;div class=&quot;tn-dialog-footer&quot;&gt;${footer}&lt;/div&gt;&lt;/section&gt;`;m.hidden=false;refreshIcons();const first=m.querySelector(&#x27;textarea,input,select,button&#x27;);if(first)first.focus();}

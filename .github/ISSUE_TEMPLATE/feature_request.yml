name: 功能建议
description: 建议一项新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前使用方式遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望 TickNote 如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 如果没有可留空
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可以添加使用场景或脱敏示意图，不要包含真实工作数据

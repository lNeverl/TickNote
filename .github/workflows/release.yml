name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $projectVersion = dotnet msbuild src/SedentaryReminder.csproj -nologo -getProperty:Version
          $informationalVersion = dotnet msbuild src/SedentaryReminder.csproj -nologo -getProperty:AssemblyInformationalVersion
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($projectVersion.Trim() -ne $tagVersion -or $informationalVersion.Trim() -ne $tagVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match Version ($projectVersion) / AssemblyInformationalVersion ($informationalVersion)"
          }

      - name: Restore
        run: dotnet restore SedentaryReminder.sln

      - name: Build
        run: dotnet build SedentaryReminder.sln --configuration Release --no-restore

      - name: Regression tests
        run: dotnet run --project tests/RegressionTests.csproj --configuration Release --no-build

      - name: Publish single-file EXE
        run: dotnet publish src/SedentaryReminder.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output dist

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $fileHash = Get-FileHash -Path 'dist/TickNote.exe' -Algorithm SHA256
          $checksum = "$($fileHash.Hash.ToLowerInvariant())  TickNote.exe`n"
          [System.IO.File]::WriteAllText("$PWD/dist/TickNote.exe.sha256", $checksum, [System.Text.Encoding]::ASCII)

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist/TickNote.exe" `
            "dist/TickNote.exe.sha256" `
            --title "TickNote $env:GITHUB_REF_NAME" `
            --generate-notes

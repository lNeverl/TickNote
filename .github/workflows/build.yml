name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SedentaryReminder.sln

      - name: Build
        run: dotnet build SedentaryReminder.sln --configuration Release --no-restore

      - name: Regression tests
        run: dotnet run --project tests/RegressionTests.csproj --configuration Release --no-build

      - name: Publish single-file EXE
        run: dotnet publish src/SedentaryReminder.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output dist

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $fileHash = Get-FileHash -Path 'dist/TickNote.exe' -Algorithm SHA256
          "$($fileHash.Hash.ToLowerInvariant())  TickNote.exe" | Set-Content -Path 'dist/TickNote.exe.sha256' -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TickNote-win-x64
          path: |
            dist/TickNote.exe
            dist/TickNote.exe.sha256
          if-no-files-found: error
          retention-days: 14
